version: 1
title: My protein component scene

# auth  = residue numbers written in the PDB file
# label = sequential polymer numbering generated by Mol*
numbering: auth

# Optional. Omit this line to apply selections to all chains unless a region
# defines chain or chains.
default_chain: A

viewer:
  # Global visual defaults inherited by every region component.
  # default      = normal Mol* rendering
  # illustrative = spacefill + illustrative colors + ignore-light + outline + SSAO
  style: illustrative

  # These values are defaults, not a separate Base structure representation.
  component_representation: spacefill
  component_color_theme: illustrative
  component_opacity: 0.45
  components_visible: true

  background: "#FFFFFF"
  show_labels: false
  show_tooltips: true
  create_components: true

  # Optional global fixed color. Used when component_color_theme is uniform and
  # a region does not define color/component_color.
  # component_color: "#CBD5E1"

  # Optional advanced defaults. Region-level mappings are merged over these.
  # component_representation_params:
  #   ignoreLight: true
  # component_color_theme_params:
  #   style:
  #     name: entity-id
  #     params:
  #       overrideWater: true
  # postprocessing:
  #   enable_outline: true
  #   enable_ssao: true

# Each enabled entry creates one named Mol* component and one representation.
# Use ONE selection form per entry:
#   1. inclusive range: start + end
#   2. exact list: positions: [2, 10, 22]
#   3. one residue: residue: 42
regions:
  # color is shorthand for:
  #   component_color_theme: uniform
  #   component_color: "#2563EB"
  - name: N-terminal domain
    start: 1
    end: 90
    color: "#2563EB"

  # No visual fields means: inherit viewer.component_* defaults.
  - name: Conserved domain
    start: 91
    end: 180

  # Exact positions become one component using native atom/CPK colors.
  - name: Active-site atoms
    positions: [202, 245, 277]
    component_representation: ball_and_stick
    component_color_theme: element-symbol
    component_opacity: 1.0

  - name: C-terminal surface
    start: 301
    end: 420
    component_representation: surface
    component_color_theme: uniform
    component_color: "#F97316"
    component_opacity: 0.65

  # Single residue:
  # - name: Catalytic lysine
  #   residue: 450
  #   component_representation: ball_and_stick
  #   component_color_theme: element-symbol

  # Per-region chain and numbering override:
  # - name: Chain B motif
  #   chain: B
  #   numbering: auth
  #   positions: [12, 19, 44, 68]
  #   color: "#10B981"
  #   tooltip: true
  #   description: Optional text shown in the Mol* hover tooltip.
