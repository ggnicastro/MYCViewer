version: 1
title: My protein regions

# auth  = residue numbers written in the PDB file
# label = sequential polymer numbering generated by Mol*
numbering: auth

# Optional. Omit this line to apply each region to every matching chain unless
# that region defines chain or chains.
default_chain: A

viewer:
  # One global style for the single visible structure representation.
  # default      = normal Mol* rendering
  # illustrative = spacefill + native illustrative color theme + ignore-light
  #                + outline + ambient occlusion, unless explicitly overridden
  style: illustrative

  # Under style: illustrative, representation defaults to spacefill when this
  # property is omitted. An explicit value overrides that default.
  # cartoon | backbone | ball_and_stick | line | spacefill | surface | putty
  # representation: spacefill
  selector: protein

  # Opacity of the one visible base representation. Region color overrides are
  # part of this same representation and therefore inherit this opacity.
  base_opacity: 0.35
  background: "#FFFFFF"

  # Keep a named Mol* selector component for every region. These components are
  # useful for focus, tooltips, selection, and manual editing in Mol* controls.
  create_components: true

  # Do not attach independent representations to the region components. This is
  # the strict single-visual mode: no duplicate region geometry is drawn.
  component_visuals: false
  base_component_name: Base structure

  show_labels: false
  show_tooltips: true

  # Optional: replace the native illustrative color theme outside annotated
  # regions with one fixed color.
  # base_color_theme: uniform
  # base_color: "#CBD5E1"

  # Optional advanced illustrative-style overrides:
  # base_color_theme_params:
  #   style:
  #     name: entity-id
  #     params:
  #       overrideWater: true
  # base_representation_params:
  #   ignoreLight: true
  # postprocessing:
  #   enable_outline: true
  #   enable_ssao: true

# Each region uses ONE selection form:
#   1. inclusive range: start + end
#   2. exact list: positions: [2, 10, 22]
#   3. one residue: residue: 42
#
# Colors are resolved from top to bottom. A later region replaces the color of
# an earlier region wherever their selections overlap.
regions:
  - name: N-terminal domain
    start: 1
    end: 25
    color: "#2563EB"

  - name: Active-site residues
    positions: [2, 10, 22]
    color: "#FACC15"

  - name: C-terminal region
    start: 36
    end: 50
    color: "#F97316"

  # Deliberate opt-in exception. component_visual creates an additional visual
  # representation and therefore is NOT strict single-visual mode.
  # - name: Active-site atoms
  #   positions: [2, 10, 22]
  #   color: "#FACC15"
  #   component_visual: true
  #   component_representation: ball_and_stick
  #   component_color_theme: element-symbol
  #   component_opacity: 1.0
  #   component_visible: true
