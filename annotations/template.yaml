version: 1
title: My protein regions

# auth  = residue numbers written in the PDB file
# label = sequential polymer numbering generated by Mol*
numbering: auth

# Optional. Omit this line to apply a region to every chain unless the region
# itself specifies chain or chains.
default_chain: A

viewer:
  # Built-in base style:
  # default      = normal Mol* rendering
  # illustrative = Mol* Illustrative quick-style defaults: spacefill,
  #                native illustrative colors, ignore-light, outlines, and SSAO
  style: illustrative

  # Under style: illustrative, representation defaults to spacefill when this
  # property is omitted. An explicit value overrides that default.
  # cartoon | backbone | ball_and_stick | line | spacefill | surface | putty
  # representation: spacefill
  selector: protein

  # Opacity of the complete named Base structure representation, from 0 to 1.
  # It does not change the opacity of independent region components.
  base_opacity: 0.35

  # Under style: illustrative, base_color_theme defaults to illustrative.
  # Use uniform when the non-annotated part should use one fixed base_color.
  # base_color_theme: illustrative
  base_color: "#CBD5E1"
  background: "#FFFFFF"
  show_labels: false
  show_tooltips: true

  # Optional advanced overrides. These are merged over the style defaults.
  # base_color_theme_params:
  #   style:
  #     name: entity-id
  #     params:
  #       overrideWater: true
  # base_representation_params:
  #   ignoreLight: true
  # postprocessing:
  #   enable_outline: true
  #   enable_ssao: true

  # Keep the colored base structure and also create one independently
  # controllable Mol* component for every enabled region.
  create_components: true
  component_representation: cartoon

  # Color theme for independent components:
  # uniform        = component_color or the region color
  # default        = Mol* default for the representation
  # element-symbol = atom/CPK colors (ideal for ball_and_stick)
  # Other useful themes include chain-id, residue-name, secondary-structure,
  # sequence-id, hydrophobicity, illustrative, and uncertainty.
  component_color_theme: uniform
  component_opacity: 1.0

  # false avoids drawing duplicate geometry over the already colored base
  # view. Open a layout with Controls, show a region representation with its eye
  # icon, and hide Base structure when you want to isolate that region.
  components_visible: false
  base_component_name: Base structure

# Each region uses ONE residue-selection form:
#   1. inclusive range: start + end
#   2. exact list: positions: [2, 10, 22]
#   3. one residue: residue: 42
# Different entries in the same YAML file may use different forms.
regions:
  - name: N-terminal domain
    start: 1
    end: 25
    color: "#2563EB"

  # Exact, non-contiguous positions become one region and one named component.
  - name: Active-site residues
    positions: [2, 10, 22]
    color: "#FACC15"
    create_component: true
    component_name: Active-site atoms
    component_representation: ball_and_stick
    component_color_theme: element-symbol
    component_visible: true

  - name: Catalytic region surface
    start: 36
    end: 50
    color: "#F97316"
    component_representation: surface
    component_color_theme: uniform
    component_color: "#F97316"
    component_opacity: 0.65
    component_visible: false

  # A one-residue selection is also supported:
  # - name: Catalytic lysine
  #   residue: 42
  #   color: "#DC2626"
  #   component_representation: ball_and_stick
  #   component_color_theme: element-symbol

  # Per-region chain and numbering overrides remain available:
  # - name: Chain B motif
  #   chain: B
  #   numbering: auth
  #   positions: [12, 19, 44, 68]
  #   color: "#10B981"
  #   component_representation: ball_and_stick
  #   component_color_theme: element-symbol
  #   tooltip: true
  #   description: Optional text shown in the legend and hover tooltip.
