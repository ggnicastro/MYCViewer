version: 1
title: Synthetic demo protein regions

# Use author residue numbers from the PDB file. Ranges are inclusive.
numbering: auth
default_chain: A

viewer:
  representation: cartoon
  selector: protein
  base_color: "#CBD5E1"
  background: "#FFFFFF"
  show_labels: false
  show_tooltips: true

  # Every enabled YAML region becomes a separately named Mol* component.
  # They start hidden so the compact colored base view is not duplicated.
  create_components: true
  component_representation: cartoon
  component_opacity: 1.0
  components_visible: false
  base_component_name: Base structure

regions:
  - name: N-terminal segment
    start: 1
    end: 10
    color: "#2563EB"

  - name: Helix 1 extension
    start: 11
    end: 18
    color: "#06B6D4"

  - name: Flexible linker 1
    start: 19
    end: 24
    color: "#F59E0B"
    component_name: Flexible linker 1 atoms
    component_representation: ball_and_stick
    component_opacity: 0.9

  - name: Central helical region
    start: 25
    end: 42
    color: "#10B981"
    component_name: Central helical surface
    component_representation: surface
    component_opacity: 0.55

  - name: Flexible linker 2
    start: 43
    end: 48
    color: "#F97316"
    component_name: Flexible linker 2 atoms
    component_representation: ball_and_stick
    component_opacity: 0.9

  - name: C-terminal helix
    start: 49
    end: 60
    color: "#8B5CF6"
